<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Scan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #00ff66;
            font-family: monospace;
            min-height: 100vh;
            padding: 25px;
            font-size: 16px;
        }

        #terminal {
            max-width: 900px;
            margin: auto;
        }

        .line {
            margin: 12px 0;
            text-shadow: 0 0 8px #00ff66;
        }

        .bar {
            width: 100%;
            height: 22px;
            border: 1px solid #00ff66;
            margin: 15px 0;
        }

        #progress {
            height: 100%;
            width: 0%;
            background: #00ff66;
            transition: width 0.2s;
        }

        #final {
            display: none;
            color: white;
            font-size: 22px;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <div id="terminal"></div>

    <div id="final">
        😂 GOTCHA! 😂<br><br>
        YE SIRF EK PRANK THA!
    </div>

    <script>
        const terminal = document.getElementById("terminal");

        const lines = [
            "Initializing secure connection...",
            "Scanning device...",
            "Finding IP address...",
            "Checking system files...",
            "Analyzing network...",
            "Downloading personal data...",
            "Decrypting passwords...",
            "Locating user...",
            "ACCESS GRANTED ☠️"
        ];

        let i = 0;

        function addLine(text) {
            const div = document.createElement("div");
            div.className = "line";
            div.textContent = "> " + text;
            terminal.appendChild(div);
        }

        function runPrank() {
            if (i < lines.length) {
                addLine(lines[i]);
                i++;

                if (i === 6) {
                    const bar = document.createElement("div");
                    bar.className = "bar";
                    bar.innerHTML = '<div id="progress"></div>';
                    terminal.appendChild(bar);

                    let progress = 0;

                    const timer = setInterval(() => {
                        progress += 5;
                        document.getElementById("progress").style.width = progress + "%";

                        if (progress >= 100) {
                            clearInterval(timer);
                        }
                    }, 100);
                }

                setTimeout(runPrank, 900);
            } else {
                setTimeout(() => {
                    document.getElementById("final").style.display = "block";
                }, 1000);
            }
        }

        runPrank();
    </script>

</body>

</html>
